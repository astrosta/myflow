[project]
name = "myflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "astrosta", email = "liyuanbofromds@gmail.com" }
]
requires-python = ">=3.12"

[project.scripts]
myflow = "myflow:main"

#[build-system]
#requires = ["uv_build>=0.12.5,<0.13.0"]
#build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "backend",
    "backend/packages/harness",
    "evals",
]

# 默认走清华 PyPI 镜像，使 uv.lock 里的制品 URL 也落在国内源上。
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
agentkit = { workspace = true }
