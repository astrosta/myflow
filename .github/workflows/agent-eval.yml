name: agent-eval

on:
  pull_request:
  schedule:
    # Nightly full run: every metric, LLM metrics as hard gates.
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # A hung Gateway must not hold the runner for the six-hour default.
    timeout-minutes: 45
    env:
      AGENT_API: ${{ secrets.AGENT_API }}
      AGENT_USERS: ${{ secrets.AGENT_USERS }}
      USER_ID_SALT: ${{ secrets.USER_ID_SALT }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      # Optional: without these the run stays rule-only and prints one warning.
      EVAL_JUDGE_BASE_URL: ${{ secrets.EVAL_JUDGE_BASE_URL }}
      EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
      EVAL_JUDGE_MODEL: ${{ secrets.EVAL_JUDGE_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # PR: fixed stratified 30-item subset. Rule metrics are hard gates; LLM
      # metrics run only when judge secrets exist, are sampled, and stay soft.
      # The dataset is frozen input here: this workflow never runs "build".
      - name: CI regression subset
        if: github.event_name == 'pull_request'
        run: >-
          uv run --project evals myflow-evals run
          --mode ci
          --dataset agent-eval/regression/v1
          --run-name "ci-${GITHUB_SHA}"

      # Nightly: full dataset with the DeepEval extra. Once a metric has at
      # least 20 scored samples, LLM metrics become hard gates.
      - name: Nightly full run
        if: github.event_name == 'schedule'
        run: >-
          uv run --project evals --extra llm myflow-evals run
          --mode full
          --dataset agent-eval/regression/v1
          --run-name "nightly-${GITHUB_SHA}"
