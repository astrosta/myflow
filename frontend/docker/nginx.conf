# =============================================================================
# M5 §7 nginx：只做三件事
#   1. 压缩——**只压文本，SSE 一律不压**（§7.1）
#   2. 反代 /api 到网关（容器内 myflow-gateway:8001），并且**不缓冲 SSE**（§7.2）
#   3. 反代页面与 /_next/static 到同容器里的 Next standalone server（127.0.0.1:3000）
#
# 为什么前端容器里要有 nginx：浏览器侧只认一个同源入口（默认 2026），
# 这样 §7.3 里"发布出去的端口"只有一个，CORS 也只需要在这一层管。
#
# 本文件被 docker/Dockerfile 装到 /etc/nginx/nginx.conf（**完整替换**，不是 http.d 片段）。
# =============================================================================

worker_processes auto;

# 日志直接进容器 stdout/stderr，交给 docker logs / 采集器
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;
    charset utf-8;

    # 容器里以非 root（nextjs）运行：临时目录不能落在 /var/lib/nginx。
    # Dockerfile 已经建好这几个目录并 chown 给 nextjs。
    client_body_temp_path /tmp/nginx/client-body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # ---------------------------------------------------------------------
    # §7.1 压缩只给文本
    # ---------------------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/html text/css application/javascript application/json;

    # 上面这份 gzip_types 是**故意不含**下面这些的，别"顺手补全"：
    #
    #   * text/event-stream —— SSE 只有在"一帧到一帧地到达"时才有意义。gzip 要在
    #     zlib 缓冲区里攒够一段才会 flush，再叠上 chunked 编码，下游看到的就是
    #     一批一批（甚至等 end 才）下发的数据。用户体感就是"模型不流式了"——
    #     明明在逐 token 生成，界面上是整段文字突然出现。（M5 §7.1 / M3 §8.1）
    #     §9 验收清单最后一条就是让人打开 DevTools 确认 SSE 响应**没有**
    #     Content-Encoding: gzip。压缩一旦打开，那一栏会明确显示 gzip。
    #   * 字体 / 图片 / 音视频（font/*、image/*、video/*、audio/*）—— 本来就是压缩
    #     容器，再压一遍只烧 CPU，某些格式还会因为二次压缩略微变大。
    #
    # 改 gzip_types 之前先读一遍 §7.1。

    # WebSocket / 升级请求要用（Next dev 的 HMR、未来的多面板）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 上游：网关。启动时由 GATEWAY_UPSTREAM 替换 __GATEWAY_UPSTREAM__。
    # 同 compose 网络里用服务名 myflow-gateway:8001；
    # 只起前端、后端在宿主机时用 host.docker.internal:8001 或宿主机 IP:8001。
    upstream myflow_gateway {
        server __GATEWAY_UPSTREAM__;
        keepalive 32;
    }

    # 上游：同容器里的 Next standalone server（PORT=3000）
    upstream myflow_frontend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        # 容器内监听 0.0.0.0 是对的：**发布出去的那个端口才是攻击面**，
        # 而它的绑定地址由 docker-compose.yml 里显式的 loopback 决定（§7.3）。
        listen 0.0.0.0:2026;
        server_name _;

        # 上传走独立的 location（见下面 uploads），这里是兜底上限
        client_max_body_size 64m;

        # -----------------------------------------------------------------
        # 1) SSE：创建流 / 旁观流（M5 §7.2 的四个开关全在这里）
        #
        # 匹配（M3 §8.1）：
        #   POST /api/threads/{tid}/runs/stream
        #   GET  /api/threads/{tid}/runs/{rid}/stream   （SDK 的 joinStream）
        #   GET  /api/threads/{tid}/runs/{rid}/join     （M3 的 /join）
        #   POST /api/threads/{tid}/runs/wait
        # -----------------------------------------------------------------
        location ~ ^/api/threads/[^/]+/runs/(?:[^/]+/)?(?:stream|join|wait)$ {
            proxy_pass http://myflow_gateway;
            proxy_http_version 1.1;

            proxy_buffering off;                    # 响应不缓冲
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;  # 告诉下游代理也别缓冲
            proxy_set_header Connection '';         # 保持长连接

            proxy_read_timeout 600s;                # run 可能跑很久
            proxy_send_timeout 600s;
            proxy_connect_timeout 600s;

            # 断点续传：把客户端的 Last-Event-ID 透传给网关（M3 §6 的缓冲游标）
            proxy_set_header Last-Event-ID $http_last_event_id;

            # 必须用 $http_host（含端口），不能用 $host。
            # 入口在 :2026 时 Origin 是 http://ip:2026，而 $host 会剥掉端口，
            # 网关 CSRF 的同源判断就会报 origin_not_allowed。
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 注意：真正让**下游**别缓冲的是网关自己发的响应头
            # X-Accel-Buffering: no（M3 §8.1）。上面那行 proxy_set_header 是把它
            # 一并发给上游，两边都表态，避免"配置写对了但实际没生效"。
            # 这条链路（浏览器 → nginx → 网关）上不存在第二个会缓冲的代理；
            # 以后前面再加一层 LB，要确认那一层同样不缓冲 SSE。
        }

        # -----------------------------------------------------------------
        # 2) 上传：**额外**关掉请求缓冲（§7.2 最后一段）
        #
        # 默认 proxy_request_buffering on 会把整个请求体先写到 nginx 的磁盘
        # （client_body_temp_path）再转给上游——一个 20 MB 的附件要落两遍盘，
        # 首字节延迟也变成"整个文件上传完"。
        #
        # 路径以 M3 实际路由为准（M3 文档里还没定死上传端点），
        # 前端 .env.example 的 NEXT_PUBLIC_MAX_UPLOAD_BYTES 是客户端侧的上限。
        # -----------------------------------------------------------------
        location ~ ^/api/threads/[^/]+/(?:uploads|files|attachments)(?:/|$) {
            proxy_pass http://myflow_gateway;
            proxy_http_version 1.1;

            proxy_request_buffering off;
            proxy_set_header Connection '';
            proxy_set_header X-Accel-Buffering no;

            client_max_body_size 512m;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 600s;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------------------
        # 3) 其余 /api：普通 JSON / artifact 下载
        #
        # 这里**不关** proxy_buffering：artifact 的 byte range 下载是几 MB 的
        # 文件，缓冲反而让上游更快释放；SSE 由上面那条正则 location 接走
        # （nginx 的规则：前缀 location 先比长度，然后按顺序比正则，正则优先）。
        # -----------------------------------------------------------------
        location /api/ {
            proxy_pass http://myflow_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # -----------------------------------------------------------------
        # 4) 静态资源长缓存
        #
        # /_next/static 的路径里带内容哈希，改内容一定换 URL，可以 immutable 一年。
        # 注意别把这条规则挪到 /_next/image 上（那是按 query 变化的优化图）。
        # -----------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://myflow_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;

            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        # -----------------------------------------------------------------
        # 5) 页面与 RSC 流：反代到 Next
        #
        # proxy_buffering off 的理由和 SSE 一样——React 的流式 SSR 也是边渲染边
        # 下发；缓冲会让"首屏已经能画了"变成"等整个 RSC 树渲染完"。
        # -----------------------------------------------------------------
        location / {
            proxy_pass http://myflow_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
