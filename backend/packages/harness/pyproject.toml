[project]
name = "agentkit"
version = "0.1.0"
authors = [
    { name = "liyuanbo", email = "liyuanbo@gomain.com.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.1",
    "langchain-core>=1.6.3",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.6.2",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0,<3.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>=3.3.0",
]
mcp = [
    "langchain-mcp-adapters>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 因为是平铺结构且外层目录名叫 harness，显式指定导出 agentkit 目录
[tool.hatch.build.targets.wheel]
packages = ["agentkit"]
