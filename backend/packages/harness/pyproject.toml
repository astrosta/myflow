[project]
name = "agentkit"
version = "0.1.0"
authors = [
    { name = "liyuanbo", email = "liyuanbo@gomain.com.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.1",
    "langchain-core>=1.6.3",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.6.2",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "httpx>=0.27",
    "pygit2>=1.20,<2",
    # contextforge.sync.timezone="local" 要在配置加载时就解析成本机时区，而默认值
    # 就是这个哨兵，所以它在核心依赖里：datetime.now().astimezone() 只给固定偏移，
    # 冬夏令时切换当天午夜会错一小时；tzlocal 读平台时区库，给出真正的 DST zone。
    "tzlocal>=5.0,<6",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>=3.3.0",
]
knowledge = [
    "pymilvus>=2.5",
]
# ContextForge：原生 MCP 客户端（tools/list + tools/call）+ 工具目录的 Milvus
# collection + tool_execute 的本地 schema 校验。mcp 必须显式声明：同步和执行都直接
# 用 mcp SDK（ClientSession / streamablehttp_client），不经过 langchain-mcp-adapters。
contextforge = [
    "mcp>=1.30,<2",
    "langchain-mcp-adapters>=0.3",
    "pymilvus>=2.5",
    "jsonschema>=4.23,<5",
    "cryptography>=43,<51",
]
# Langfuse 可观测性。enabled=false 时不 import；启用前先 uv sync --extra observability。
observability = [
    "langfuse>=5.1,<6",
]
# 技能目录的 Git/扫描/检索运行时依赖。pymilvus 只用于 active projection；
# cisco-ai-skill-scanner 的 import 名是 skill_scanner，由 security_scan.py 懒加载。
skills = [
    "pymilvus>=2.5",
    "cisco-ai-skill-scanner>=2.2,<3",
]
# stream_bridge.backend=redis / GATEWAY_WORKERS>1 需要它（可选：没装也能跑 memory 后端）
redis = [
    "redis>=5.0",
]
# E2B provider 的协议客户端；需与 redis extra 一起安装。
e2b = [
    "e2b>=2.62,<3",
]
# OpenSandbox provider 的 Python SDK（sync 客户端）；Docker/K8s runtime 由
# opensandbox-server 提供，lease 复用 redis extra。
opensandbox = [
    "opensandbox>=1.2,<2",
]
# OpenViking thin adapter. Server 0.4.19 is external; this is only the HTTP SDK.
openviking = [
    "openviking-sdk==0.1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 因为是平铺结构且外层目录名叫 harness，显式指定导出 agentkit 目录
[tool.hatch.build.targets.wheel]
packages = ["agentkit"]