[project]
name = "backend"
version = "0.1.0"
authors = [
    { name = "liyuanbo", email = "liyuanbo@gomain.com.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "agentkit",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.20",
    # M9 §2：密码哈希与 JWT。都是 app 层依赖——harness 不认识账号表。
    "bcrypt>=4.1",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
postgres = [
    "agentkit[postgres]",
]
knowledge = [
    "agentkit[knowledge]",
]
# M9 §3.6：多 worker / 跨进程直播帧。app 层透传，实际实现在 harness。
redis = [
    "agentkit[redis]",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    # Redis 版桥的协议测试跑在 fakeredis 上：不需要真的 Redis 服务，也不进生产依赖
    "fakeredis>=2.30",
]

[tool.uv.sources]
agentkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
