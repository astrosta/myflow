# ============================================================
# MyFlow 配置模板 —— 复制为 config.yaml 后编辑（config.yaml 已 gitignored）
#   cp config.example.yaml config.yaml
# ============================================================

# schema 版本。改 schema 时 bump；加载时比对，过低会提示升级。
config_version: 1

# 只影响 myflow / app 两个 logger，不动第三方库。
# startup-only: 改了要重启（apply_logging_level 只在启动时跑一次）
log_level: info

# 下一条消息生效。default_model 必须是下面 models[].name 之一。
agents:
  default_model: deepseek-v4-flash

# startup-only: 改了要重启（按 type 创建的单例不会随热重载重建）
# M1 只认 memory。
checkpointer:
  type: postgres

# ------------------------------------------------------------
# 模型。列表顺序有意义：不指定模型时用第一个。
# 以 $ 开头的值从环境变量读取；读不到会直接报错，不会静默变成空串。
# ------------------------------------------------------------
models:
  - name: deepseek-v4-flash
    use: langchain_deepseek:ChatDeepSeek
    model: deepseek-flash
    api_key: $DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com   # 是 base_url 不是 api_base（见 §7.4 坑一）
    provider: DeepSeek                   # 模型列表上方的小字；不写就从 use 推导
    supports_thinking: true
    when_thinking_enabled:
      extra_body:
        thinking: { type: enabled }
    # 模型列表由网关调 GET {base_url}/models 得到；厂商不可达时回退到下面这一条。
    # 推理等级：先用这里公布的候选；没写整段就用厂商集成自带的 profile。
    # 输入框里的 "Off" = 不指定（不下发该参数），不需要在这里列出来。
    reasoning_efforts:
      - id: low
        label: Low
      - id: medium
        label: High
      - id: high
        label: Max

  # - name: gpt-4o                       # 唯一标识，API 和前端用这个名字选模型
  #   display_name: GPT-4o               # 给人看的，不会传给 provider
  #   description: OpenAI 旗舰多模态模型
  #   use: langchain_openai:ChatOpenAI   # 反射类路径。这是代码执行入口，故本文件不可 API 写
  #   model: gpt-4o                      # provider 侧的模型 ID
  #   api_key: $OPENAI_API_KEY
  #   context_window: 128000             # 总窗口（prompt + completion），UI 算占用率用
  #   max_tokens: 4096                   # 单次输出上限 —— 和上面那个不是一回事
  #   supports_vision: true


# ------------------------------------------------------------
# M8 子代理委派。整段热重载。
# 两个上限别合成一个：max_total_per_run 管"一次 run 累计派几个"（防止长 run 每个
# 检查点都合法地派一批），进程级"同时跑几个"在下面的 subagent_runtime。
# ------------------------------------------------------------
subagents:
  timeout_seconds: 1800      # 内置子代理默认墙钟上限（秒）
  max_turns: null            # 模型调用次数上限；null = 用该类型自己的值
                             # （general-purpose=150，bash=60，knowledge-researcher=12，
                             #  memory-researcher=10，skill-finder=8）。执行器按图节点换算 recursion_limit。
  max_total_per_run: 6       # 一次父 run 累计委派上限，1–50
  token_budget:
    enabled: true
    # max_tokens 留空即跟 summarization.enabled 耦合：开压缩 1_000_000，关 2_000_000；
    # 显式写了就永远以显式值为准。
    warn_threshold: 0.7
  agents: {}                 # 按名字覆盖 builtin / custom：timeout_seconds / max_turns / model / token_budget
  # 内置检索子代理随功能开关出现：knowledge-researcher（knowledge_base.enabled）、
  # memory-researcher（memory.openviking.enabled）、skill-finder（skills.search.enabled）。
  # 它们使用 lead 不再直接持有的检索工具；子代理不可用时检索工具退回 lead 直连。
  # 委派默认开启（run 未显式传 subagent_enabled 时按 true 处理）；allowed_subagents: [] 可关闭。
  custom_agents: {}          # 自定义类型，例如：
  # researcher:
  #   description: "深度调研一个主题，给出带来源的结论"     # 会进提示词的发现列表
  #   system_prompt: "你是调研员，只回结论不回过程。"
  #   tools: null              # null = 继承 lead 当时持有的全部工具
  #   disallowed_tools: [task, ask_clarification]   # 默认就是 [task]：M8 不做嵌套委派
  #   skills: null             # 暂未生效（子代理链没有技能中间件）
  #   model: inherit           # inherit = 跟 lead 同名；否则必须是 models[].name
  #   max_turns: 80
  #   timeout_seconds: 900

# 进程级容量 —— startup-only：准入控制器在 Gateway 启动时构建，改完必须重启。
subagent_runtime:
  max_running: 3             # 同时在跑几个，1–64（也是单轮并行的默认上限）
  max_queued: 64             # 等待队列容量；0 = 满槽即拒绝
  admission_policy: queue    # queue | reject
  queue_timeout_seconds: 300 # 排队等待上限；超时按准入失败处理

# ------------------------------------------------------------
# M9 §2 认证。enabled=false **只**给单人演示：所有请求跑在固定的 default 用户上、
# 数据进 default 桶，且 GATEWAY_WORKERS>1 时启动直接拒绝（§2.11）。
#
# 生产（多用户 / 公网）：
#   enabled: true
#   jwt_secret: $AUTH_JWT_SECRET   # ≥32 字节；读不到会直接报错。改了 = 所有会话立刻失效
#   allow_registration: false      # 自助注册要显式打开
#   internal_tokens: [$MYFLOW_INTERNAL_AUTH_TOKEN]   # 通道/调度器代表用户用；支持 [new, old] 轮换
# cookie 只在 HTTPS / 本机 localhost / 显式 opt-in 时持久化（§2.4）。
# ------------------------------------------------------------
auth:
  enabled: true
  jwt_secret: "asdxdvrfsddgdhgdhfghfgh5trtcverwex"                # 生产写 $AUTH_JWT_SECRET
  jwt_ttl_seconds: 84600        # 没有 refresh token：过期就重新登录
  allow_registration: true
  internal_tokens: []
  local:
    max_login_attempts: 5       # 最小 2：单次失败不得锁 IP
    lockout_seconds: 300        # 热重载
    specific_errors: true       # 登录失败说清原因（邮箱未注册 / 密码错 / 被禁用 / 回收期）；
                                # 设 false 全部收敛成 401 invalid_credentials（防账号枚举）

# ------------------------------------------------------------
# 以下 section 留着是为了让文件形状从一开始就稳定。
# 整段注释掉会被 YAML 解析成 null，加载器当作"缺失"走默认值（见 §5.7）。
# ------------------------------------------------------------
# sandbox:         # M2
# database:        # M4   startup-only
# summarization:   # M6
# plugins:         # M10  startup-only，且会导致代码被 import
database:
  backend: postgres          # memory | sqlite | postgres   startup-only
  sqlite_dir: .myflow
  url: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/myflow   # 仅 postgres
  checkpoint_channel_mode: full   # full | delta，启动时冻结
  postgres_schema: ""             # 非空时钉 search_path

# ------------------------------------------------------------
# 检索服务通用配置：知识库和技能检索共用同一套 embedding / rerank /
# Milvus 连接。各自的 collection、超时、开关与指令仍留在下面两个 section。
# 这里的值可以被具体 section 覆盖。
# ------------------------------------------------------------
embedding:
  provider: openai_compatible
  protocol: openai            # openai | tei
  base_url: $EMBEDDING_BASE_URL
  path: /embeddings
  api_key: $EMBEDDING_API_KEY
  model: Qwen/Qwen3-Embedding-8B
  dimensions: 4096
  max_input_tokens: 8192
  send_dimensions: false

rerank:
  protocol: cohere            # cohere | tei
  base_url: $RERANK_BASE_URL
  path: /rerank
  api_key: $RERANK_API_KEY
  model: Qwen/Qwen3-Reranker-8B

vector_store:
  provider: milvus
  uri: $VECTOR_STORE_URI   # 当前环境已配置，无鉴权
  token:
  db_name:

run_events:
  backend: db          # memory | db | jsonl          startup-only
  max_trace_content: 10240 # 仅 db：category=trace 超此字节截断
  track_token_usage: true  # RunJournal 是否把 usage 累到 RunRow

# 直播帧的桥：进程级单例，lifespan 里建一次（backend 是 startup-only）。
# 多 worker（GATEWAY_WORKERS>1）必须 backend=redis，否则启动直接拒绝（M9 §3.5）。
stream_bridge:
  backend: redis                  # memory | redis                        startup-only
  queue_maxsize: 256               # 每 run 保留的数据事件数，决定"能重放多久"
  heartbeat_interval_seconds: 15   # 0 = 关掉心跳（只给嵌入式 / IM 直读用）

  # ---- 下面只在 backend=redis 时生效。先装依赖：cd backend && uv sync --extra redis ----
  redis_url: $REDIS_URL            # 有密码就换成 $REDIS_URL：环境变量注入，别写进版本库
  stream_ttl_seconds: 3600         # retained key 的 TTL，每次 publish/end 刷新（泄漏安全网，不是 run 超时）
  tombstone_ttl_seconds: 300       # cleanup 之后"已回收"保留多久；期间订阅立刻拿到 END
  key_prefix: myflow:stream        # 三个 key 共享 {run_id} hash tag，集群下同 slot
  socket_timeout_seconds: 15      # 必须比 read_block 至少多 5 秒，否则空闲的 XREAD BLOCK 会被客户端先掐断
  socket_connect_timeout_seconds: 5
  health_check_interval_seconds: 30
  max_connections: 32
  read_block_seconds: 5            # XREAD BLOCK 的上限；心跳按本地计时，不靠它

# ------------------------------------------------------------
# 技能：用户私有技能写入 Git/PostgreSQL，内置技能随进程发布；沙箱根目录是 container_path。
# 模型看到的是系统提示词尾部的 <available_skills> 索引（每技能一行，描述截断）；
# 正文一律按需：要么 read_file 读 SKILL.md，要么 search_and_load_skills 按意图检索加载。
# 没有"全量注入"模式开关（M7 §3.5）。
# 个人偏好仍在 skills_prefs.json。技能保存后是草稿，必须安全扫描通过并点击生效才进入运行时与向量索引。
# ------------------------------------------------------------
skills:
  # git：生产目录（Git 是唯一内容源，PostgreSQL 拥有身份/版本/扫描/active 指针）。
  # filesystem：仅测试/本地调试时扫描本地 skills/ 目录，不提供用户创作。
  source: git                 # startup-only：切换来源要重启

  # 内置技能：随项目发布、只读，不进 Git/数据库；每个子目录一个技能（builtin/<name>/SKILL.md）。
  # enabled 与 path 都是 startup-only：只读挂载在 Sandbox provider 构造时固定，改完要重启进程。
  builtin:
    enabled: true
    path: skills/builtin

  # 私有技能的配额与包边界。
  creation:
    enabled: true             # 关掉后任何人都不能创建技能
    max_drafts_per_user: 20
    max_package_bytes: 5242880    # 单个技能包（所有文件之和）
    max_file_bytes: 1048576       # 单个技能文件
    max_files: 200

  # 服务端技能仓库。凭据只在这里；普通用户永远拿不到。
  git:
    repository: $SKILLS_GIT_REPOSITORY   # 代码里没有默认仓库地址
    draft_ref_prefix: "refs/heads/myflow/drafts"
    cache_dir: .myflow/skills
    ssh_key: $SKILLS_GIT_SSH_KEY
    command_timeout_seconds: 120

  # Milvus active projection 的 outbox、对账与清理节奏。
  # outbox：状态变更在同一个 PG 事务里插一行“意图”，worker 异步把它变成 Milvus 的
  #   active 行（幂等、可重试、过期事件自动跳过）。
  # 对账：按 reconciliation_interval_minutes 周期跑，修事件丢失/重试耗尽/collection
  #   被清空这类漂移；稳态下已经索引好的行不会被重新 embedding。
  # 清理：同一轮里删掉没人引用的提交缓存，受 retention.cache_ttl_days 安全期保护。
  index:
    outbox_poll_seconds: 2                 # worker 轮询：生效后最慢多久能被向量召回
    catalog_poll_seconds: 5                # 跨 worker catalog epoch 轮询；0 = 单 worker 不同步
    reconciliation_interval_minutes: 10    # 修复快路径周期：只修 index_status != ready
    maintenance_lock: true                 # 多 worker 每轮互斥（pg_try_advisory_lock）
    repair_budget_rows: 500                # 每轮最多修多少版本（超出的下一轮继续）
    repair_budget_seconds: 180             # 每轮墙钟上限，和行数预算先到为准
    repair_max_attempts: 8                 # 同一版本连续失败多少次后停止重试
    verify_interval_minutes: 60            # 完整性巡查：流式扫描 Milvus 主键；0 = 关闭
    verify_budget_rows: 5000               # 巡查每轮最多读多少主键
    verify_budget_seconds: 300             # 巡查每轮墙钟上限

  # 每个用户的技能使用次数：Redis ZSET 只做 top-K 排序，PostgreSQL load_count 持久化。
  usage:
    enabled: true
    redis_url: $REDIS_URL           # 留空则退回 PostgreSQL load_count
    key_prefix: myflow:skills:usage # key = <prefix>:<user_id>
    prompt_top_k: 10                # 私有技能超过 N 个时，system prompt 只列前 N 个
    refresh_seconds: 30             # 多 worker 的 top-K 缓存刷新间隔；0 = 关闭
  # 可重建缓存的保留策略；数据库元数据与扫描历史永久保留。
  retention:
    keep_versions_per_skill: 20
    cache_ttl_days: 30

  path: skills                  # 相对项目根
  container_path: /mnt/skills   # startup-only：技能根目录，写进提示词一次；沙箱里按它 mount
  index_description_max_chars: 120

  # 检索加载（search_and_load_skills）：技能多到一个都读不完时，模型按任务意图
  # 检索并一次加载最相关的几个技能正文。默认只有本地 BM25，不需要任何外部服务；
  # embedding / rerank 要填地址才开（代码里没有默认端点）。
  search:
    enabled: true                 # 关掉后这个工具不注册，技能只能靠索引 + read_file
    candidate_k: 5               # 召回交给精排的候选数
    top_k: 3                     # 最终加载几个技能的正文
    rrf_k: 10                     # 两路召回融合的 RRF k
    min_score: null               # 融合分数下限（归一化到 1.0），null = 不过滤
    max_body_chars: 6000          # 单个技能正文预算
    max_context_chars: 12000      # 一次加载的正文总预算

    keyword:                      # 本地稀疏通道
      enabled: true
      bm25_k1: 1.2
      bm25_b: 0.75
      keyword_weight: 2.0         # domain_keywords 的分数倍数
      name_weight: 3.0            # 命中技能名/描述的额外倍数

    embedding:                    # 可选语义召回（bi-encoder）
      enabled: true              # 打开时共用配置的 embedding.base_url 必填
      batch_size: 8
      timeout_seconds: 30
      max_retries: 1
      query_instruction: "Given a task description, retrieve the skill whose operating procedure applies"

    rerank:                       # 可选精排（cross-encoder）；失败自动回退融合顺序
      enabled: true              # 打开时共用配置的 rerank.base_url 与 model 必填
      max_document_chars: 4000
      timeout_seconds: 30
      max_retries: 1

    # active projection 的 Milvus collection。投影是"当前激活状态"的物化视图，
    # 不是知识库那张表：collection 固定 myflow_skills_active，绝不能和
    # myflow_knowledge 共用。连接参数来自顶层 vector_store。
    vector_store:
      collection: myflow_skills_active
      metric_type: COSINE
      index_type: AUTOINDEX
      consistency_level: Strong   # 点击生效后马上要能检索到，不用 Session 的最终一致
      flush: true
      timeout_seconds: 30

  # <active_skills>：已激活技能的核心 SOP 要不要跟着进持久上下文。
  # 正文**不进 state**（checkpoint 会膨胀）：每次投影按台账里的 path 现读现用，受这里的预算约束。
  active_context:
    enabled: true                 # 关掉只留名字、描述和目录
    max_body_chars: 4000          # 单个技能正文预算
    max_context_chars: 8000       # 整块正文总预算
    skip_bodies_still_in_context: true   # 正文还在消息里就不重复写（压缩之后才会补）


# ------------------------------------------------------------
# 知识库（MinerU + Qwen3-Embedding-8B + Milvus）
# enabled=false 时不需要装 pymilvus/transformers，也不会给 agent 挂检索工具。
# 启用前必须填写所有服务地址：代码里没有默认端点。
# 安装：uv sync --all-packages --all-extras（会同时装 postgres/mcp 等 extra）
# ------------------------------------------------------------
knowledge_base:
  enabled: true
  storage_dir: .myflow/knowledge
  allowed_extensions: [pdf, doc, docx, ppt, pptx, xls, xlsx, md, markdown, txt, html, htm, csv, epub]
  text_extensions: [md, markdown, txt, html, htm, csv]
  max_file_size_bytes: 52428800
  max_total_size_bytes: 209715200
  max_files_per_request: 10
  max_knowledge_bases_per_user: 50
  max_documents_per_base: 200
  max_ingest_concurrency: 2

  parse:
    provider: mineru
    mode: cloud                 # local | cloud
    local:
      endpoint: ""              # 必填：本地 MinerU 地址，例如 http://127.0.0.1:8000
      file_parse_path: /v1/file_parse
      api_key: ""               # 可选；需要时写 $MINERU_API_KEY
      response_format: zip
      tier: flash
      ocr_mode: txt
      timeout_seconds: 600
    cloud:
      base_url: "https://mineru.net"              # 必填：例如 https://mineru.net（只写主机，不写接口路径）
      api_key: $MINERU_API_KEY               # 必填；建议写 $MINERU_API_KEY
      # 云端接口路径全部在这里配置，代码里没有默认端点：换网关/代理只改这两行。
      file_urls_path: /api/v4/file-urls/batch        # POST：申请上传 URL
      extract_results_path: /api/v4/extract-results/batch/{batch_id}  # GET：轮询任务（必须含 {batch_id}）
      model_version: pipeline
      language: ch
      enable_formula: true
      enable_table: true
      is_ocr: false
      poll_interval_seconds: 2
      timeout_seconds: 900
      max_download_bytes: 536870912
    max_download_bytes: 536870912

  chunking:
    tokenizer:
      provider: qwen             # qwen | approximate
      # model 默认取顶层 embedding.model；需要单独指定时再写在这里。
      path: ""                  # 可选：本地 tokenizer 目录
      local_files_only: false
    min_chunk_tokens: 32
    max_chunk_tokens: 1024
    separators: ["\n\n", "\n", "。", "！", "？", "；", ". ", "! ", "? ", "; ", "，", ", ", " "]
    types:
      technical:
        strategy: heading_hierarchy
        chunk_size_tokens: 512
        chunk_overlap_tokens: 64
      operations:
        strategy: procedure
        chunk_size_tokens: 512
        chunk_overlap_tokens: 0
      faq:
        strategy: qa_pair
        chunk_size_tokens: 384
        chunk_overlap_tokens: 0
      security:
        strategy: clause
        chunk_size_tokens: 512
        chunk_overlap_tokens: 0
      api:
        strategy: api_reference
        chunk_size_tokens: 768
        chunk_overlap_tokens: 0
      legal:                        # 法律法规：按“第X条”切分，条号进 section
        strategy: legal_clause
        chunk_size_tokens: 512
        chunk_overlap_tokens: 0

  # 服务地址、模型和维度来自顶层 embedding；这里只保留知识库自己的策略。
  embedding:
    batch_size: 8
    timeout_seconds: 120
    max_retries: 2
    query_instruction: "Given a question, retrieve passages from the user's knowledge base that answer it"
    document_instruction: ""

  # 连接参数来自顶层 vector_store；collection 是知识库自己的检索契约。
  vector_store:
    collection: myflow_knowledge
    metric_type: COSINE
    index_type: AUTOINDEX
    consistency_level: Session
    flush: true
    timeout_seconds: 30

  retrieval:
    top_k: 5
    candidate_k: 20                 # 每个召回通道的候选数，也是交给精排的条数
    rrf_k: 60                       # RRF 融合的 k（与 Milvus RRFRanker 同参数）
    score_threshold: null           # 仅纯向量检索生效；COSINE 常用 0.2~0.4
    max_context_chars: 8000

    # 关键词通道：BM25 稀疏检索，由 Milvus 服务端完成分词与打分。
    keyword:
      enabled: true
      analyzer: chinese             # chinese | english | standard；改后需重建 collection
      bm25_k1: 1.2
      bm25_b: 0.75

    # 精排：开关关掉时直接用 RRF 融合顺序。
    rerank:
      enabled: true                # 打开时顶层 rerank.base_url 与 model 必填
      max_document_chars: 4000
      timeout_seconds: 60
      max_retries: 1

# ------------------------------------------------------------
# 长期记忆权威开关。false = 不做长期记忆（画像表单仍可用）；
# true = OpenViking。旧 canonical runtime 已退役，不再作为 false 的 fallback。
# 这是 startup-only 开关；打开前必须配置 redis_url 和至少 32 字符的
# user_id_salt（建议用环境变量注入），否则进程会拒绝启动。
# ------------------------------------------------------------
memory:
  openviking:
    enabled: true
    url: $OPENVIKING_URL
    root_api_key: $OPENVIKING_ROOT_API_KEY
    user_id_salt: $MYFLOW_MEMORY_ID_SALT
    capture_stream:
      redis_url: $REDIS_URL
      shard_count: 16              # 每个分片一条阻塞连接；startup-only，改完要重启


# ------------------------------------------------------------
# Langfuse 可观测性。远程实例已安装，这里只做客户端接入。
# 整段 startup-only：client/exporter 在 lifespan 里构造一次，改了要重启。
# 默认关闭；关闭时不 import langfuse，也不发任何网络请求。
# 启用前先装依赖：cd backend && uv sync --extra observability
# ------------------------------------------------------------
observability:
  langfuse:
    enabled: true
    base_url: $LANGFUSE_BASE_URL                  # 启用时写 $LANGFUSE_BASE_URL，根地址不要带 /api/public
    public_key: $LANGFUSE_PUBLIC_KEY                # 启用时写 $LANGFUSE_PUBLIC_KEY
    secret_key: $LANGFUSE_SECRET_KEY                # 启用时写 $LANGFUSE_SECRET_KEY
    project_id: ""                # 可选：只用于生成 trace 深链
    environment: development      # 小写字母/数字/-/_，不超过 40 字符
    release: ""                   # 可选：部署版本；留空则由 SDK 读取 release 环境
    sample_rate: 1.0              # 0.0–1.0；head sampling，错误 trace 也可能被采样掉
    timeout_seconds: 5            # 导出 HTTP 超时
    capture_content: redacted     # redacted | metadata_only | full
    user_id_mode: hashed          # hashed | raw | none
    user_id_salt: $LANGFUSE_USER_ID_SALT              # hashed 时必填，至少 16 字符；不要复用 JWT secret
    trace_subagents: true         # 是否给隔离子代理建子 trace/span
    flush_on_run_end: false       # 默认不在请求路径同步 flush
    required: false               # true 时初始化失败会阻止启动；默认降级为 no-op

# 本地沙箱是路径映射，不是隔离。宿主 bash 默认关闭。
# sandbox.use 是 startup-only：改了要重启。
sandbox:
  # 生产切 Cube：use: agentkit.sandbox.cube:CubeSandboxProvider，并启用下面的 cube 段。
  use: agentkit.sandbox.opensandbox:OpenSandboxProvider
  bash_command_timeout: 600
  mounts: []
  opensandbox:
    domain: 127.0.0.1:8080            # 服务端地址，host:port
    protocol: http                    # http | https
    api_key: ""                       # 留空读 OPEN_SANDBOX_API_KEY
    image: python:3.12
    timeout_seconds: 1800             # sandbox TTL，到期由服务端回收
    ready_timeout_seconds: 30
    request_timeout_seconds: 30       # SDK HTTP 超时，不是命令超时
    acquire_timeout_seconds: 120      # 等 Redis per-thread 锁的上限
    resource:
      cpu: "1"
      memory: 1Gi
    release_action: keep              # keep（交给 TTL）| destroy（释放即 kill）
    max_cached_threads: 64            # 进程内缓存上限；驱逐只丢 handle
    discover_existing: true           # 进程重启后按 metadata 捡回自己的 sandbox
    startup_healthcheck: true         # 启动时校验服务端 /health、挂载、Redis
    release_action: keep              # keep（交给 TTL）| destroy（释放即 kill）
    prewarm: true                     # 模型开始生成时后台 acquire，首 token 不等容器启动；
                                      # 只有代码块/路径/命令等工具信号才预取，纯文本轮不建沙箱；
                                      # 首个沙箱工具复用这次 acquire，没用到则在后台释放
    prewarm_max_concurrent: 1         # 每进程并发预取上限；满额时该轮退回工具惰性 acquire

    # sandbox 级 env；不要放 secret。请求级 token 走工具调用的 env。
    env:
      TZ: Asia/Shanghai

    # 宿主挂载：与 cube 段同形状。local_root 是 Gateway 视角，
    # host_root 是**服务端宿主**视角（卷源按它翻译）。
    # 同一台机器上两者都是项目根；opensandbox.toml 的 allowed_host_paths 必须包含 host_root。
    host_mount:
      local_root: /home/liyuanbo/python/myflow
      host_root: /home/liyuanbo/python/myflow

    # 必填：与 cube 共用同一个 per-thread Redis 锁。Redis 不可达时启动失败。
    lease:
      redis_url: $REDIS_URL
      ttl_seconds: 30

    orphan_policy: report             # report | remove；remove 需配合 orphan_ttl_seconds
    orphan_ttl_seconds: 86400

    endpoint_host: "127.0.0.1"
    # endpoint_host_map:
    #   host.docker.internal: 127.0.0.1

    # SDK 已弃用的代理数据面；保持 false 走直连
    use_server_proxy: false

    run_code:
      image: opensandbox/code-interpreter:v1.1.0
      entrypoint:
        - /opt/code-interpreter/code-interpreter.sh
      ready_timeout_seconds: 30
