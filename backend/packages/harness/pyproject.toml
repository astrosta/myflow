[project]
name = "agentkit"
version = "0.1.0"
authors = [
    { name = "liyuanbo", email = "liyuanbo@gomain.com.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.1",
    "langchain-core>=1.6.3",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.6.2",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "httpx>=0.27",
    "pygit2>=1.20,<2",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>=3.3.0",
]
mcp = [
    "langchain-mcp-adapters>=0.3",
]
knowledge = [
    "pymilvus>=2.5",
    "transformers>=4.51",
]
# 技能目录的 Git/审核/检索运行时依赖。pymilvus 只用于 active projection。
skills = [
    "pymilvus>=2.5",
]
# stream_bridge.backend=redis / GATEWAY_WORKERS>1 需要它（可选：没装也能跑 memory 后端）
redis = [
    "redis>=5.0",
]
# CubeSandbox provider 的 E2B 协议客户端；需与 redis extra 一起安装。
cube = [
    "e2b>=2.62,<3",
]
# OpenViking thin adapter. Server 0.4.19 is external; this is only the HTTP SDK.
openviking = [
    "openviking-sdk==0.1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 因为是平铺结构且外层目录名叫 harness，显式指定导出 agentkit 目录
[tool.hatch.build.targets.wheel]
packages = ["agentkit"]
