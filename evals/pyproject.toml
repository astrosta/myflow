[project]
name = "myflow-evals"
version = "0.1.0"
description = "Black-box HTTP evaluations for MyFlow"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myflow_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
