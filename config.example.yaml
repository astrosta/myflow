# ============================================================
# MyFlow 配置模板 —— 复制为 config.yaml 后编辑（config.yaml 已 gitignored）
#   cp config.example.yaml config.yaml
# ============================================================

# schema 版本。改 schema 时 bump；加载时比对，过低会提示升级。
config_version: 1

# 只影响 myflow / app 两个 logger，不动第三方库。
# startup-only: 改了要重启（apply_logging_level 只在启动时跑一次）
log_level: info

# 下一条消息生效。default_model 必须是下面 models[].name 之一。
agents:
  default_model: deepseek-reasoner

# startup-only: 改了要重启（按 type 创建的单例不会随热重载重建）。
# Gateway 的 lifespan 实际按 database.backend 创建 checkpointer；这一节供
# AgentClient / CLI 使用。memory | sqlite | postgres；postgres 还要求
# database.backend: postgres 和 database.url（复用同一份 libpq DSN）。
checkpointer:
  type: memory

# ------------------------------------------------------------
# 模型。列表顺序有意义：不指定模型时用第一个。
# 以 $ 开头的值从环境变量读取；读不到会直接报错，不会静默变成空串。
# ------------------------------------------------------------
models:
  - name: deepseek-reasoner
    use: langchain_deepseek:ChatDeepSeek
    model: deepseek-reasoner
    api_key: $DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com   # 是 base_url 不是 api_base（见 §7.4 坑一）
    provider: DeepSeek                   # 模型列表上方的小字；不写就从 use 推导
    supports_thinking: true
    when_thinking_enabled:
      extra_body:
        thinking: { type: enabled }
    # 模型列表由网关调 GET {base_url}/models 得到（厂商新报的模型也能选，名字是
    # `<name>@<vendor-id>`）；厂商不可达时回退到上面这一条。
    # 推理等级（可选）：值是发给 provider 的 id，label 是输入框里的显示名（首字母大写，
    # 不写解释文字）。整段不写就用厂商集成自带的 profile；输入框里的 "Off" 表示
    # 不指定（不下发该参数），不需要在这里列出来。标 default: true 的那档会被预选。
    reasoning_efforts:
      - id: low
        label: Low
      - id: medium
        label: Medium
        default: true
      - id: high
        label: High

  # - name: gpt-4o                       # 唯一标识，API 和前端用这个名字选模型
  #   display_name: GPT-4o               # 给人看的，不会传给 provider
  #   description: OpenAI 旗舰多模态模型
  #   use: langchain_openai:ChatOpenAI   # 反射类路径。这是代码执行入口，故本文件不可 API 写
  #   model: gpt-4o                      # provider 侧的模型 ID
  #   api_key: $OPENAI_API_KEY
  #   context_window: 128000             # 总窗口（prompt + completion），UI 算占用率用
  #   max_tokens: 4096                   # 单次输出上限 —— 和上面那个不是一回事
  #   supports_vision: true


# ------------------------------------------------------------
# M9 §2 认证。enabled=false **只**给单人演示：所有请求跑在固定的 default 用户上、
# 数据进 default 桶，且 GATEWAY_WORKERS>1 时启动直接拒绝（§2.11）。
#
# 生产（多用户 / 公网）：
#   enabled: true
#   jwt_secret: $AUTH_JWT_SECRET   # ≥32 字节；读不到会直接报错。改了 = 所有会话立刻失效
#   allow_registration: false      # 自助注册要显式打开
#   internal_tokens: [$MYFLOW_INTERNAL_AUTH_TOKEN]   # 通道/调度器代表用户用；支持 [new, old] 轮换
# cookie 只在 HTTPS / 本机 localhost / 显式 opt-in 时持久化（§2.4）。
# ------------------------------------------------------------
auth:
  enabled: false
  jwt_secret: ""                # 生产写 $AUTH_JWT_SECRET
  jwt_ttl_seconds: 86400        # 没有 refresh token：过期就重新登录
  allow_registration: false
  internal_tokens: []
  local:
    max_login_attempts: 5       # 最小 2：单次失败不得锁 IP
    lockout_seconds: 300        # 热重载
    specific_errors: true       # 登录失败说清原因（邮箱未注册 / 密码错 / 被禁用 / 回收期）；
                                # 设 false 全部收敛成 401 invalid_credentials（防账号枚举）

database:
  backend: sqlite          # memory | sqlite | postgres   startup-only
  sqlite_dir: .myflow
  url: $DATABASE_URL   # 仅 postgres；容器内服务名见 .env.example
  checkpoint_channel_mode: full   # full | delta，启动时冻结
  postgres_schema: ""             # 非空时钉 search_path

# ------------------------------------------------------------
# 检索服务通用配置：知识库和技能检索共用同一套 embedding / rerank /
# Milvus 连接。各自的 collection、超时、开关与指令仍留在下面两个 section。
# 这里的值可以被具体 section 覆盖。
# ------------------------------------------------------------
embedding:
  provider: openai_compatible
  protocol: openai            # openai | tei
  base_url: ""                # 必填：Qwen3-Embedding-8B 服务地址
  path: /embeddings
  api_key: ""                 # 可写 $EMBEDDING_API_KEY
  model: Qwen/Qwen3-Embedding-8B
  dimensions: 4096
  max_input_tokens: 8192
  send_dimensions: false

rerank:
  protocol: cohere            # cohere | tei
  base_url: ""                # 精排服务地址，例如 http://127.0.0.1:8000
  path: /rerank
  api_key: ""                 # 可写 $RERANK_API_KEY
  model: Qwen/Qwen3-Reranker-8B

vector_store:
  provider: milvus
  uri: ""                     # 必填：例如 http://127.0.0.1:19530
  token: ""
  db_name: ""

# ------------------------------------------------------------
# 长期记忆。画像/ onboarding 始终由 DB 支撑；下面的开关只控制
# OpenViking 的 capture / append / 检索。旧 canonical runtime 已删除。
# ------------------------------------------------------------
memory:
  # false = 不做长期记忆（只保留 DB-backed 画像表单）；
  # true = OpenViking。默认必须保持 false。
  openviking:
    enabled: false
    url: http://127.0.0.1:1933
    account: myflow
    root_api_key: ""          # 生产用 $OPENVIKING_ROOT_API_KEY
    user_id_salt: ""          # 生产用 $MYFLOW_MEMORY_ID_SALT（至少 32 字符；true 时必填）
    required: false
    # Session 只用 idle-only auto-commit；0 表示关闭 token/message 阈值。
    # 记忆查询与管理页支持 7 类：preferences / entities / events / cases /
    # trajectories / experiences / tools。session skills 是独立链路，不是记忆类型：
    # OpenViking 在 commit task 完成后返回 session_skill_uris，MyFlow 把它们导入
    # Git 技能目录，标记为「提炼」并停在待扫描，等用户在前端扫描/生效。
    # 创建 session 固定使用 DEFAULT_SESSION_MEMORY_TYPES（6 类）。
    capture_stream:
      redis_url: ""            # 生产用 $MYFLOW_REDIS_URL
      shard_count: 64
      claim_idle_ms: 60000
    capture:
      missing_turn_end_timeout_seconds: 86400
    # Session Commit 后台任务的 skills 导入：等待任务结束后读取
    # session_skill_uris，按技能目录逐个生成「提炼 · 待扫描」草稿。
    session_skills:
      enabled: true
      poll_interval_seconds: 2
      task_timeout_seconds: 180
      max_skills_per_task: 20


# ------------------------------------------------------------
# PII / 敏感信息边界。只覆盖文本 HumanMessage 和模型输出；多模态、文件、
# tool result 由对应工具自身负责，不在本策略保证范围内。
# 假名只在当前 run 的内存 vault 中可还原；进程重启后旧 handle 不可解析。
# ------------------------------------------------------------
pii:
  enabled: true
  redact_ai_output: true

run_events:
  backend: memory          # memory | db | jsonl          startup-only
  max_trace_content: 10240 # 仅 db：category=trace 超此字节截断
  track_token_usage: true  # RunJournal 是否把 usage 累到 RunRow

# 直播帧的桥：进程级单例，lifespan 里建一次（backend 是 startup-only）。
# 多 worker（GATEWAY_WORKERS>1）必须 backend=redis，否则启动直接拒绝（M9 §3.5）。
stream_bridge:
  backend: memory                  # memory | redis                        startup-only
  queue_maxsize: 256               # 每 run 保留的数据事件数，决定"能重放多久"
  heartbeat_interval_seconds: 15   # 0 = 关掉心跳（只给嵌入式 / IM 直读用）

  # ---- 下面只在 backend=redis 时生效。先装依赖：cd backend && uv sync --extra redis ----
  redis_url: redis://127.0.0.1:6379/0   # 有密码就换成 $REDIS_URL：环境变量注入，别写进版本库
  stream_ttl_seconds: 3600         # retained key 的 TTL，每次 publish/end 刷新（泄漏安全网，不是 run 超时）
  tombstone_ttl_seconds: 300       # cleanup 之后"已回收"保留多久；期间订阅立刻拿到 END
  key_prefix: myflow:stream        # 三个 key 共享 {run_id} hash tag，集群下同 slot
  socket_timeout_seconds: 15      # 必须比 read_block 至少多 5 秒，否则空闲的 XREAD BLOCK 会被客户端先掐断
  socket_connect_timeout_seconds: 5
  health_check_interval_seconds: 30
  max_connections: 32
  read_block_seconds: 5            # XREAD BLOCK 的上限；心跳按本地计时，不靠它

# ------------------------------------------------------------
# Langfuse 可观测性。远程实例已安装，这里只做客户端接入。
# 整段 startup-only：client/exporter 在 lifespan 里构造一次，改了要重启。
# 默认关闭；关闭时不 import langfuse，也不发任何网络请求。
# 启用前先装依赖：cd backend && uv sync --extra observability
# ------------------------------------------------------------
observability:
  langfuse:
    enabled: false
    base_url: ""                  # 启用时写 $LANGFUSE_BASE_URL，根地址不要带 /api/public
    public_key: ""                # 启用时写 $LANGFUSE_PUBLIC_KEY
    secret_key: ""                # 启用时写 $LANGFUSE_SECRET_KEY
    project_id: ""                # 可选：只用于生成 trace 深链
    environment: development      # 小写字母/数字/-/_，不超过 40 字符
    release: ""                   # 可选：部署版本；留空则由 SDK 读取 release 环境
    sample_rate: 1.0              # 0.0–1.0；head sampling，错误 trace 也可能被采样掉
    timeout_seconds: 5            # 导出 HTTP 超时
    capture_content: redacted     # redacted | metadata_only | full
    user_id_mode: hashed          # hashed | raw | none
    user_id_salt: ""              # hashed 时必填，至少 16 字符；不要复用 JWT secret
    trace_subagents: true         # 是否给隔离子代理建子 trace/span
    flush_on_run_end: false       # 默认不在请求路径同步 flush
    required: false               # true 时初始化失败会阻止启动；默认降级为 no-op

# 本地沙箱是路径映射，不是隔离。宿主 bash 默认关闭。
# sandbox.use 是 startup-only：改了要重启。
sandbox:
  # provider 三选一（不写 = local）。切 provider 只改这一行 + 展开对应的段：
  #   agentkit.sandbox.local:LocalSandboxProvider         进程内路径映射，不是隔离边界
  #   agentkit.sandbox.e2b:E2BSandboxProvider            需要 e2b 段 + E2B 兼容控制面（无宿主挂载）
  #   agentkit.sandbox.opensandbox:OpenSandboxProvider   需要 opensandbox 段 + opensandbox-server
  use: agentkit.sandbox.local:LocalSandboxProvider
  # 只对 local 生效：local 下默认不暴露 bash 工具。换成 e2b/opensandbox 时这个开关被忽略
  # （隔离来自沙箱/容器，bash 工具始终可用），不要在隔离环境里指望它关掉 bash。
  allow_host_bash: false
  # 所有 provider 共用：单条命令的墙钟超时（秒）。e2b 作为 SDK 命令超时，
  # opensandbox 用作 RunCommandOpts.timeout，local 用作子进程超时。
  bash_command_timeout: 600
  # 额外挂载 {container_path, local_path, read_only}。
  # opensandbox 并进宿主挂载；local 直接加映射；e2b 不读宿主目录，忽略这一项。
  mounts: []
  # run_code 工具（跑一段代码，一次调用拿输出）。默认关闭：关着模型看不见这个工具。
  #   local      只有 allow_host_bash 为 true 才放行（等于在宿主上跑模型代码）
  #   e2b        走沙箱 shell（模板自带 python3）
  #   opensandbox 配了 opensandbox.run_code 就走 Code Interpreter，否则走 shell
  run_code:
    enabled: false
    default_language: python
    timeout_seconds: 120

  # E2B（无宿主挂载，显式同步）。默认保持注释：本地 provider 不需要这一节。
  # 取消注释前先装依赖：cd backend && uv sync --extra e2b（= agentkit[e2b,redis]），
  # 否则 sandbox.use 指向 E2B 会因缺 e2b/redis 拒绝启动。
  # sandbox.e2b 整段是 startup-only：改完要重启 Gateway。
  #
  # 协议里没有 bind mount：acquire 上传宿主 uploads/，release 下载 outputs/；
  # 技能文件在 read_file / list_dir / glob / grep 命中时按需上传，不预传整棵树。
  # e2b:
  #   api_url: $E2B_API_URL             # 控制面地址；不依赖 SDK 默认的 127.0.0.1:3000
  #   api_key: ""                       # 留空时由 e2b SDK 读 E2B_API_KEY；无鉴权保持空
  #   template_id: $E2B_TEMPLATE_ID     # 必填；模板要自带 mkdir/cat/python3/grep/find/sed
  #   sandbox_domain: cube.app          # 数据面 <port>-<sandbox-id>.<domain> 必须可解析（wildcard DNS）
  #
  #   # 生命周期：pause 保持沙箱热；kill 每次重建。release 前会先下载 outputs/。
  #   timeout_seconds: 1800             # 空闲 TTL，显式给值，不依赖集群默认
  #   on_timeout: pause                 # kill | pause
  #   auto_resume: true
  #   release_action: pause             # kill | pause；shutdown() 会先下载 outputs 再 kill
  #   acquire_timeout_seconds: 120      # 等 Redis per-thread 锁的上限
  #   request_timeout_seconds: 30       # 控制面 HTTP 超时，不是命令超时
  #   startup_healthcheck: true         # 启动时控制面 health + Redis PING，失败即拒绝启动
  #
  #   # 网络
  #   allow_internet_access: true
  #   allow_public_traffic: false
  #   sandbox_user: root                # 默认 root；非 root 要先验证 UID/GID 与模板工具
  #   network:
  #     deny_out:
  #       - 169.254.169.254/32
  #
  #   # 显式同步：替代宿主挂载。单文件超限跳过并 warning，整树超限放弃并 warning。
  #   sync:
  #     enabled: true
  #     upload_uploads: true            # acquire 上传宿主 uploads/
  #     upload_workspace: false         # 默认不回放上一轮工作区
  #     upload_skills: true             # 允许技能按需上传（不是预传整棵树）
  #     download_outputs: true          # release 下载沙箱 outputs/
  #     download_workspace: false       # 默认不把工作区回写到宿主
  #     max_file_bytes: 33554432        # 32 MiB
  #     max_tree_bytes: 268435456       # 256 MiB
  #
  #   # 必填：多 worker 的 per-thread 锁。Redis 不可达时启动失败。
  #   lease:
  #     redis_url: $REDIS_URL
  #     ttl_seconds: 30
  #
  #   max_cached_threads: 64             # 进程内缓存上限；驱逐只丢 handle，不 pause/kill 远端

  # OpenSandbox（容器隔离，由 opensandbox-server 托管）。默认保持注释。
  # 前置：
  #   1) 起服务端（镜像自带的是 k8s 配置，要换成 docker 配置再跑；默认 127.0.0.1:8080，/health 可探）：
  #        docker run --rm -v ~:/cfg opensandbox/server:release-1.2.0 init-config /cfg/.sandbox.toml --example docker
  #        容器里绑 127.0.0.1 发布不出去：把 [server] host 改成 0.0.0.0，[docker] host_ip 改成 host.docker.internal
  #        docker run -d --name opensandbox-server --add-host=host.docker.internal:host-gateway \
  #          -v /var/run/docker.sock:/var/run/docker.sock \
  #          -v ~/.sandbox.toml:/etc/opensandbox/config.toml:ro \
  #          -e SANDBOX_CONFIG_PATH=/etc/opensandbox/config.toml \
  #          -p 127.0.0.1:8080:8080 opensandbox/server:release-1.2.0
  #   2) 装依赖：  cd backend && uv sync --extra opensandbox（= agentkit[opensandbox,redis]）
  #      Gateway 不再需要 docker CLI：容器由服务端创建和管理。
  # sandbox.opensandbox 整段是 startup-only。
  #
  # 镜像只要自带 bash 就够（grep 走 shell），不要求 AIO 那种大镜像。
  # opensandbox:
  #   domain: $OPEN_SANDBOX_DOMAIN      # 服务端 host:port；容器内 opensandbox:8080
  #   protocol: http                    # http | https
  #   api_key: ""                       # 留空读 OPEN_SANDBOX_API_KEY
  #
  #   # 数据面直连地址。服务端按 [docker] host_ip 生成 endpoint；Gateway 与
  #   # OpenSandbox 容器的网络位置不同，看到的可达主机名也不同：
  #   #   Gateway 在宿主机：服务端返回 host.docker.internal:<宿主端口> 时，
  #   #     endpoint_host: 127.0.0.1（或宿主机在容器网络里的可达 IP）。
  #   #   Gateway 在容器里：保留服务端返回值（容器需 --add-host=host.docker.internal:host-gateway），
  #   #     或把服务端返回值映射成实际可达的宿主机/网关地址。
  #   # endpoint_host 为空 = 使用服务端返回的 host；只改 host，端口和 /proxy/... 路径保留。
  #   endpoint_host: ""
  #   endpoint_host_map: {}             # 精确映射，key 可为 host 或 host:port，例如 {host.docker.internal: 127.0.0.1}
  #   use_server_proxy: false           # SDK 已弃用的代理数据面；保持 false 走直连
  #   image: python:3.12
  #   timeout_seconds: 1800             # sandbox TTL，到期由服务端回收
  #   ready_timeout_seconds: 30
  #   request_timeout_seconds: 30       # SDK HTTP 超时，不是命令超时
  #   acquire_timeout_seconds: 120      # 等 Redis per-thread 锁的上限
  #   resource:
  #     cpu: "2"
  #     memory: 2Gi
  #   release_action: keep              # keep（交给 TTL）| destroy（释放即 kill）
  #   prewarm: true                     # 模型开始生成时后台 acquire，首 token 不等容器启动；
  #                                     # 只有代码块/路径/命令等工具信号才预取，纯文本轮不建沙箱；
  #                                     # 首个沙箱工具复用这次 acquire，没用到则在后台释放
  #   prewarm_max_concurrent: 1         # 每进程并发预取上限；满额时该轮退回工具惰性 acquire
  #   max_cached_threads: 64            # 进程内缓存上限；驱逐只丢 handle
  #   discover_existing: true           # 进程重启后按 metadata 捡回自己的 sandbox
  #   startup_healthcheck: true         # 启动时校验服务端 /health、挂载、Redis
  #
  #   # sandbox 级 env；不要放 secret。请求级 token 走工具调用的 env。
  #   env:
  #     TZ: Asia/Shanghai
  #
  #   # 宿主挂载（E2B provider 没有这一概念）。local_root 是 Gateway 视角，
  #   # host_root 是**服务端宿主**视角（卷源按它翻译）。host_root 写
  #   # $SANDBOX_HOST_ROOT（仓库根 .env）；opensandbox.toml allowed_host_paths 同值。
  #   host_mount:
  #     local_root: /opt/myflow
  #     host_root: $SANDBOX_HOST_ROOT
  #
  #   # 必填：与 E2B 共用同一个 per-thread Redis 锁。Redis 不可达时启动失败。
  #   lease:
  #     redis_url: $REDIS_URL
  #     ttl_seconds: 30
  #
  #   orphan_policy: report             # report | remove；remove 需配合 orphan_ttl_seconds
  #   orphan_ttl_seconds: 86400
  #
  #   # Code Interpreter：配了这段（且 sandbox.run_code.enabled=true）时，沙箱用这个
  #   # 镜像 + entrypoint 创建，run_code 走解释器（能返回表达式结果、支持 ts/java/go）；
  #   # 不配就走 shell 通道（只剩 python/javascript/bash）。
  #   run_code:
  #     image: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/code-interpreter:v1.1.0
  #     entrypoint:
  #       - /opt/code-interpreter/code-interpreter.sh
  #     ready_timeout_seconds: 30

# ------------------------------------------------------------
# M8 子代理委派。整段热重载。
# 两个上限别合成一个：max_total_per_run 管"一次 run 累计派几个"（防止长 run 每个
# 检查点都合法地派一批），进程级"同时跑几个"在下面的 subagent_runtime。
# ------------------------------------------------------------
subagents:
  timeout_seconds: 1800      # 内置子代理默认墙钟上限（秒）
  max_turns: null            # 模型调用次数上限；null = 用该类型自己的值
                             # （general-purpose=150，bash=60，knowledge-researcher=12，
                             #  memory-researcher=10，skill-finder=8）。执行器按图节点换算 recursion_limit。
  max_total_per_run: 6       # 一次父 run 累计委派上限，1–50
  token_budget:
    enabled: true
    # max_tokens 留空即跟 summarization.enabled 耦合：开压缩 1_000_000，关 2_000_000；
    # 显式写了就永远以显式值为准。
    warn_threshold: 0.7
  agents: {}                 # 按名字覆盖 builtin / custom：timeout_seconds / max_turns / model / token_budget
  # 内置检索子代理随功能开关出现：knowledge-researcher（knowledge_base.enabled）、
  # memory-researcher（memory.openviking.enabled）、skill-finder（skills.search.enabled）。
  # 它们使用 lead 不再直接持有的检索工具；子代理不可用时检索工具退回 lead 直连。
  # 委派默认开启（run 未显式传 subagent_enabled 时按 true 处理）；allowed_subagents: [] 可关闭。
  custom_agents: {}          # 自定义类型，例如：
  # researcher:
  #   description: "深度调研一个主题，给出带来源的结论"     # 会进提示词的发现列表
  #   system_prompt: "你是调研员，只回结论不回过程。"
  #   tools: null              # null = 继承 lead 当时持有的全部工具
  #   disallowed_tools: [task, ask_clarification]   # 默认就是 [task]：M8 不做嵌套委派
  #   skills: null             # 暂未生效（子代理链没有技能中间件）
  #   model: inherit           # inherit = 跟 lead 同名；否则必须是 models[].name
  #   max_turns: 80
  #   timeout_seconds: 900

# 进程级容量 —— startup-only：准入控制器在 Gateway 启动时构建，改完必须重启。
subagent_runtime:
  max_running: 3             # 同时在跑几个，1–64（也是单轮并行的默认上限）
  max_queued: 64             # 等待队列容量；0 = 满槽即拒绝
  admission_policy: queue    # queue | reject
  queue_timeout_seconds: 300 # 排队等待上限；超时按准入失败处理

# ------------------------------------------------------------
# 以下 section 留着是为了让文件形状从一开始就稳定。
# 整段注释掉会被 YAML 解析成 null，加载器当作"缺失"走默认值（见 §5.7）。
# ------------------------------------------------------------
# plugins:         # M10  startup-only，且会导致代码被 import

# ------------------------------------------------------------
# 技能：用户私有技能写入 Git/PostgreSQL，内置技能随进程发布；沙箱根目录是 container_path。
# 模型看到的是系统提示词尾部的 <available_skills> 索引（每技能一行，描述截断）；
# 正文一律按需：要么 read_file 读 SKILL.md，要么 search_and_load_skills 按意图检索加载。
# 没有"全量注入"模式开关（M7 §3.5）。
# 个人开关写 PostgreSQL 的 skills.enabled；技能保存后是草稿，必须安全扫描通过并点击生效才进入运行时与向量索引。
# ------------------------------------------------------------
skills:
  # git：生产目录（Git 是唯一内容源，PostgreSQL 拥有身份/版本/扫描/active 指针）。
  # filesystem：仅测试/本地调试时扫描本地 skills/ 目录，不提供用户创作。
  source: filesystem                 # startup-only：切换来源要重启

  # 内置技能：随项目发布、只读，不进 Git/数据库；每个子目录一个技能（builtin/<name>/SKILL.md）。
  # enabled 与 path 都是 startup-only：只读挂载在 Sandbox provider 构造时固定，改完要重启进程。
  builtin:
    enabled: true
    path: skills/builtin

  # 私有技能的配额与包边界。
  creation:
    enabled: true             # 关掉后任何人都不能创建技能
    max_drafts_per_user: 20
    max_package_bytes: 5242880    # 单个技能包（所有文件之和）
    max_file_bytes: 1048576       # 单个技能文件
    max_files: 200

  # 服务端技能仓库。凭据只在这里；普通用户永远拿不到。
  git:
    repository: $SKILLS_GIT_REPOSITORY   # 代码里没有默认仓库地址
    draft_ref_prefix: "refs/heads/myflow/drafts"
    cache_dir: .myflow/skills
    ssh_key: ""  # base64 编码的 SSH 私钥内容；生产用 $SKILLS_GIT_SSH_KEY
    command_timeout_seconds: 120

  # Milvus active projection 的 outbox、对账与清理节奏。
  # outbox：状态变更在同一个 PG 事务里插一行“意图”，worker 异步把它变成 Milvus 的
  #   active 行（幂等、可重试、过期事件自动跳过）。
  # 对账：按 reconciliation_interval_minutes 周期跑，修事件丢失/重试耗尽/collection
  #   被清空这类漂移；稳态下已经索引好的行不会被重新 embedding。
  # 清理：同一轮里删掉没人引用的提交缓存，受 retention.cache_ttl_days 安全期保护。
  index:
    outbox_poll_seconds: 2                 # worker 轮询：生效后最慢多久能被向量召回
    catalog_poll_seconds: 5                # 跨 worker catalog epoch 轮询；0 = 单 worker 不同步
    reconciliation_interval_minutes: 10    # 修复快路径周期：只修 index_status != ready
    maintenance_lock: true                 # 多 worker 每轮互斥（pg_try_advisory_lock）
    repair_budget_rows: 500                # 每轮最多修多少版本（超出的下一轮继续）
    repair_budget_seconds: 180             # 每轮墙钟上限，和行数预算先到为准
    repair_max_attempts: 8                 # 同一版本连续失败多少次后停止重试
    verify_interval_minutes: 60            # 完整性巡查：流式扫描 Milvus 主键；0 = 关闭
    verify_budget_rows: 5000               # 巡查每轮最多读多少主键
    verify_budget_seconds: 300             # 巡查每轮墙钟上限

  # 每个用户的技能使用次数：Redis ZSET 只做 top-K 排序，PostgreSQL load_count 持久化。
  usage:
    enabled: true
    redis_url: $REDIS_URL           # 留空则退回 PostgreSQL load_count
    key_prefix: myflow:skills:usage # key = <prefix>:<user_id>
    prompt_top_k: 10                # 私有技能超过 N 个时，system prompt 只列前 N 个
    refresh_seconds: 30             # 多 worker 的 top-K 缓存刷新间隔；0 = 关闭
  # 可重建缓存的保留策略；数据库元数据与扫描历史永久保留。
  retention:
    keep_versions_per_skill: 20
    cache_ttl_days: 30


  path: skills                  # 相对项目根
  container_path: /mnt/skills   # startup-only：编译进提示词索引与沙箱 mount
  index_description_max_chars: 120

  # 检索加载（search_and_load_skills）：技能多到一个都读不完时，模型按任务意图
  # 检索并一次加载最相关的几个技能正文。dense 向量、BM25 稀疏检索与 RRF 融合
  # 都在 Milvus 服务端完成；启用 search 时必须能连上 Milvus。
  search:
    enabled: false                 # 关掉后这个工具不注册，技能只能靠索引 + read_file
    candidate_k: 20               # 召回交给精排的候选数
    top_k: 3                      # 最终加载几个技能的正文
    rrf_k: 60                     # Milvus RRFRanker 的 k（服务端融合）
    min_score: null               # Milvus 返回分下限（RRF 原始分），null = 不过滤
    max_body_chars: 6000          # 单个技能正文预算
    max_context_chars: 12000      # 一次加载的正文总预算

    keyword:                      # Milvus 内的 BM25 稀疏通道
      enabled: true              # 示例至少保留一路召回；关闭时 search.enabled 也必须关
      analyzer: chinese           # 建 collection 前确定；改后需重建 myflow_skills_active
      bm25_k1: 1.2
      bm25_b: 0.75

    embedding:                    # 可选语义召回（bi-encoder）
      enabled: false              # 打开时共用配置的 embedding.base_url 必填
      batch_size: 8
      timeout_seconds: 30
      max_retries: 1
      query_instruction: "Given a task description, retrieve the skill whose operating procedure applies"

    rerank:                       # 可选精排（cross-encoder）；失败自动回退融合顺序
      enabled: false              # 打开时共用配置的 rerank.base_url 与 model 必填
      max_document_chars: 4000
      timeout_seconds: 30
      max_retries: 1

    # active projection 的 Milvus collection。投影是"当前激活状态"的物化视图，
    # 不是知识库那张表：collection 固定 myflow_skills_active，绝不能和
    # myflow_knowledge 共用。连接参数来自顶层 vector_store。
    vector_store:
      collection: myflow_skills_active
      metric_type: COSINE
      index_type: AUTOINDEX
      consistency_level: Bounded  # Bounded Staleness：有界延迟一致
      flush: true
      timeout_seconds: 30

  # <active_skills>：已激活技能的核心 SOP 要不要跟着进持久上下文。
  # 正文**不进 state**（checkpoint 会膨胀）：每次投影按台账里的 path 现读现用，受这里的预算约束。
  active_context:
    enabled: true                 # 关掉只留名字、描述和目录
    max_body_chars: 4000          # 单个技能正文预算
    max_context_chars: 8000       # 整块正文总预算
    skip_bodies_still_in_context: true   # 正文还在消息里就不重复写（压缩之后才会补）




# ------------------------------------------------------------
# ContextForge 工具管理（可选）。enabled=false 时不发任何网络请求。
#
# 部署前提（ContextForge 侧）：
#   MCPGATEWAY_ADMIN_API_ENABLED=true   # /admin/events 与 /tools 管理 API 才会挂载
#   MCPGATEWAY_UI_ENABLED 可以保持 false
#   admin_token 需要 admin.events（或 *）权限；GET /admin/events 不需要 CSRF
#   ContextForge 侧多 worker 时它需要 Redis，跨进程事件才会出现在 /admin/events。
#
# 权威数据：contextforge_tools 表（MCP tools/list + Admin /tools 合并）。Milvus
# 里那个 collection 只是可重建的检索投影，工具定义永远回表读，读不到就丢掉陈旧
# 的命中文档。工具更新有四条路径：管理页写操作、GET /admin/events、每天本地
# daily_at 全量、以及工具调用失败后的一次刷新；POST /api/tools/reindex 手动全量。
#
# 固定单 worker：GATEWAY_WORKERS 必须为 1。这个 runtime 是进程级的（一个事件
# 订阅器、一个午夜任务、一把同步锁），enabled=true 且 workers>1 时启动直接拒绝。
# 安装：uv sync --all-packages --all-extras（或 --extra contextforge）。
# ------------------------------------------------------------
contextforge:
  enabled: false
  base_url: ""                    # 例如 http://127.0.0.1:4444
  admin_token: ""                 # 生产用 $CONTEXTFORGE_ADMIN_TOKEN；需 admin.events 或 *
  agent_token: ""                 # 可留空；默认复用 admin_token
  mcp_url: ""                     # 留空 = <base_url>/mcp；有虚拟服务器时自动加 /servers/<id>/mcp
  virtual_server_id: ""
  verify_tls: true
  request_timeout_seconds: 15
  connect_timeout_seconds: 5
  tool_name_prefix: false

  sync:
    admin_refresh_async: true     # 管理页写操作立即返回，刷新在后台跑
    startup_sync: true
    daily_at: "00:00"             # 本地墙钟时间；格式错了加载时直接报
    timezone: local               # local = 网关主机时区；也可写 IANA 名（Asia/Shanghai）
    daily_jitter_seconds: 60      # 只用来错开重启，不改变日期边界
    sync_timeout_seconds: 60      # 单次同步预算；超时算失败，保留上一版
    cache_ttl_seconds: 60
    retry_on_tool_error: true
    tool_error_refresh_timeout_seconds: 10
    gc_on_manual_reindex: true

  admin_events:
    enabled: true                 # ContextForge 未开管理 API 时可关掉，避免重连日志
    url: ""                       # 留空 = <base_url>/admin/events
    token: ""                     # 留空复用 admin_token
    reconnect_min_seconds: 1
    reconnect_max_seconds: 60
    read_timeout_seconds: 90
    debounce_ms: 500              # 一阵事件合并成一次同步
    refresh_min_interval_seconds: 5

  search:                         # tool_search 的召回策略与输出预算
    enabled: true
    candidate_k: 20
    top_k: 5
    rrf_k: 60                     # Milvus RRFRanker 的 k（服务端融合）
    min_score: null               # Milvus 返回分下限（RRF 原始分），null = 不过滤
    max_document_chars: 4000
    max_description_chars: 500
    max_schema_chars: 3000        # 单张卡片的 schema 预算；截断后仍是合法 JSON
    max_result_chars: 16000       # 整条 tool_search ToolMessage 的预算
    require_retrieved: true       # tool_execute 只接受本轮 tool_search 返回过的 call_name
    max_retrieved_tools: 5        # run-scoped 可调用名单上限，最大 5

    keyword:                      # Milvus 内的 BM25 稀疏通道
      enabled: true
      analyzer: chinese           # destructive：建 collection 前确定
      bm25_k1: 1.2
      bm25_b: 0.75

    embedding:                    # 复用顶层 embedding 的地址、模型与维度
      enabled: true
      query_instruction: "Given a task, retrieve the tool that can perform it"

    rerank:                       # 可选精排；失败自动保留融合顺序
      enabled: false

    vector_store:                 # 复用顶层 Milvus 连接，只固定 collection
      collection: myflow_contextforge_tools   # 固定值；写成知识库/技能 collection 会报错
      metric_type: COSINE
      index_type: AUTOINDEX
      consistency_level: Bounded  # Bounded Staleness：有界延迟一致
      flush: true
      timeout_seconds: 30


# ------------------------------------------------------------
# 知识库（MinerU + Qwen3-Embedding-8B + Milvus）
# enabled=false 时不需要装 pymilvus，也不会给 agent 挂检索工具。
# 启用前必须填写所有服务地址：代码里没有默认端点。
# 安装：uv sync --all-packages --all-extras（会同时装 postgres/mcp 等 extra）
# ------------------------------------------------------------
knowledge_base:
  enabled: false
  storage_dir: .myflow/knowledge
  allowed_extensions: [pdf, doc, docx, ppt, pptx, xls, xlsx, md, markdown, txt, html, htm, csv, epub]
  text_extensions: [md, markdown, txt, html, htm, csv]
  max_file_size_bytes: 52428800
  max_total_size_bytes: 209715200
  max_files_per_request: 10
  max_knowledge_bases_per_user: 50
  max_documents_per_base: 200
  max_ingest_concurrency: 2

  parse:
    provider: mineru
    mode: local                 # local | cloud
    local:
      endpoint: ""              # 必填：本地 MinerU 地址，例如 http://127.0.0.1:8000
      file_parse_path: /v1/file_parse
      api_key: ""               # 可选；需要时写 $MINERU_API_KEY
      response_format: zip
      tier: flash
      ocr_mode: txt
      timeout_seconds: 600
    cloud:
      base_url: ""              # 必填：例如 https://mineru.net（只写主机，不写接口路径）
      api_key: ""               # 必填；建议写 $MINERU_API_KEY
      # 云端接口路径全部在这里配置，代码里没有默认端点：换网关/代理只改这两行。
      file_urls_path: /api/v4/file-urls/batch        # POST：申请上传 URL
      extract_results_path: /api/v4/extract-results/batch/{batch_id}  # GET：轮询任务（必须含 {batch_id}）
      model_version: pipeline
      language: ch
      enable_formula: true
      enable_table: true
      is_ocr: false
      poll_interval_seconds: 2
      timeout_seconds: 900
      max_download_bytes: 536870912
    max_download_bytes: 536870912

  chunking:
    # 分片固定使用内置近似 token 计数，没有 tokenizer 配置项。
    min_chunk_tokens: 32
    max_chunk_tokens: 1024
    separators: ["\n\n", "\n", "。", "！", "？", "；", ". ", "! ", "? ", "; ", "，", ", ", " "]
    types:
      technical:
        strategy: heading_hierarchy
        chunk_size_tokens: 512
        chunk_overlap_tokens: 64
      operations:
        strategy: procedure
        chunk_size_tokens: 512
        chunk_overlap_tokens: 0
      faq:
        strategy: qa_pair
        chunk_size_tokens: 384
        chunk_overlap_tokens: 0
      security:
        strategy: clause
        chunk_size_tokens: 512
        chunk_overlap_tokens: 0
      api:
        strategy: api_reference
        chunk_size_tokens: 768
        chunk_overlap_tokens: 0
      legal:                        # 法律法规：按“第X条”切分，条号进 section
        strategy: legal_clause
        chunk_size_tokens: 512
        chunk_overlap_tokens: 0

  # 服务地址、模型和维度来自顶层 embedding；这里只保留知识库自己的策略。
  embedding:
    batch_size: 8
    timeout_seconds: 120
    max_retries: 2
    query_instruction: "Given a question, retrieve passages from the user's knowledge base that answer it"
    document_instruction: ""

  # 连接参数来自顶层 vector_store；collection 是知识库自己的检索契约。
  vector_store:
    collection: myflow_knowledge
    metric_type: COSINE
    index_type: AUTOINDEX
    consistency_level: Bounded  # Bounded Staleness：有界延迟一致
    flush: true
    timeout_seconds: 30

  retrieval:
    top_k: 5
    candidate_k: 20                 # 每个召回通道的候选数，也是交给精排的条数
    rrf_k: 60                       # RRF 融合的 k（与 Milvus RRFRanker 同参数）
    score_threshold: null           # 仅纯向量检索生效；COSINE 常用 0.2~0.4
    max_context_chars: 8000

    # 关键词通道：BM25 稀疏检索，由 Milvus 服务端完成分词与打分。
    keyword:
      enabled: true
      analyzer: chinese             # chinese | english | standard；改后需重建 collection
      bm25_k1: 1.2
      bm25_b: 0.75

    # 精排：开关关掉时直接用 RRF 融合顺序。
    rerank:
      enabled: false                # 打开时顶层 rerank.base_url 与 model 必填
      max_document_chars: 4000
      timeout_seconds: 60
      max_retries: 1